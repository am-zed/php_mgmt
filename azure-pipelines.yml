# Azure Pipelines - PHP version & module management on RHEL
#
# Manually-triggered pipeline that installs, updates, removes, or audits a
# target PHP version and set of PHP modules on one or more self-hosted RHEL
# 9/10 DevOps agents, and optionally sets the installed version as the system
# default.
#
# Packages are sourced exclusively from INTERNAL mirrors that must already be
# configured and enabled on each target VM (see "Internal mirrors" below). The
# public Remi/EPEL repositories are never installed, enabled, or contacted.
#
# Trigger: manual only (no CI triggers).
trigger: none

# Internal mirror baseurls, per RHEL major version. These are the
# expected baseurls that must appear in an ENABLED repo in
# /etc/yum.repos.d/*.repo on each target VM. The VMs must already have the
# repos configured and enabled; these values are what the mirror-check step
# verifies against. Replace the placeholders with the real internal mirror
# baseurls.
variables:
  REMI9_MIRROR: https://mirror.internal.example.com/remi/9
  EPEL9_MIRROR: https://mirror.internal.example.com/epel/9
  REMI10_MIRROR: https://mirror.internal.example.com/remi/10
  EPEL10_MIRROR: https://mirror.internal.example.com/epel/10

parameters:
  - name: mode
    displayName: "Mode"
    type: string
    default: install
    values: [install, update, remove, audit]

  - name: phpVersion
    displayName: "PHP Version (x.y or x.y.z)"
    type: string
    default: "8.3"

  - name: modules
    displayName: "Modules (comma-separated; added on install, removed on remove, 'all' to remove whole stack)"
    type: string
    default: ""

  - name: targetVMs
    displayName: "Target VMs (comma-separated VM names; required)"
    type: string
    default: ""

  - name: poolName
    displayName: "Agent Pool Name"
    type: string
    default: "rhel-pool"

  - name: setAsDefault
    displayName: "Set as default PHP version on target VMs (install mode)"
    type: boolean
    default: false

  - name: outputFormat
    displayName: "Audit output format"
    type: string
    default: table
    values: [table, csv]

stages:
  - stage: ManagePHP
    displayName: Manage PHP on RHEL VMs
    jobs:
      - template: pipelines/templates/php-mgmt-job.yml
        parameters:
          mode: ${{ parameters.mode }}
          phpVersion: ${{ parameters.phpVersion }}
          modules: ${{ parameters.modules }}
          targetVMs: ${{ parameters.targetVMs }}
          poolName: ${{ parameters.poolName }}
          setAsDefault: ${{ parameters.setAsDefault }}
          outputFormat: ${{ parameters.outputFormat }}