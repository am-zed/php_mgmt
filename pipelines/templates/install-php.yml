parameters:
  - name: phpVersion
    type: string

steps:
  - task: Bash@3
    condition: and(succeeded(), eq(variables['mirrorsReady'], 'true'))
    displayName: Install PHP ${{ parameters.phpVersion }}
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/scripts/install-php.sh
      arguments: "'${{ parameters.phpVersion }}'"