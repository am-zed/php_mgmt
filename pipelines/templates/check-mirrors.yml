# Step template: verify internal Remi & EPEL mirrors are configured and
# enabled on the target VM (read-only). Sets the job variable `mirrorsReady`
# (true/false) consumed by the install/update/remove step conditions.
steps:
  - task: Bash@3
    displayName: Check internal mirror configuration
    env:
      REMI9_MIRROR: $(REMI9_MIRROR)
      EPEL9_MIRROR: $(EPEL9_MIRROR)
      REMI10_MIRROR: $(REMI10_MIRROR)
      EPEL10_MIRROR: $(EPEL10_MIRROR)
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/scripts/check-mirrors.sh